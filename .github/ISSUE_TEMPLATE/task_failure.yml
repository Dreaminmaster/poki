name: Task failure
description: Poki ran but could not complete a real task in a specific app (blocked screen, wrong target, would not stop).
labels: ["type:task-failure"]
body:
  - type: markdown
    attributes:
      value: |
        Use this when the tools work but a task in a particular app fails. Crashes and tool errors go in a **Bug report**.
        Agents filing for a user: read [AGENTS.md](https://github.com/JosssphZhou/poki/blob/main/AGENTS.md#file-an-issue).
  - type: textarea
    id: task
    attributes:
      label: Requested task
      description: The task you provided and the target app.
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Point of failure
      description: The screen where Poki got stuck, and what it did or reported there.
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Client or integration
      options:
        - Poki Agent (terminal)
        - Poki Agent over iMessage or Telegram
        - Another MCP client (Claude Code, Codex, ...)
        - Poki iPhone app
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Poki version and model
      description: The Poki version and commit (or app build), along with the model used.
      placeholder: 0.1.1 f4fd51e, gpt-6.1
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: iPhone model and iOS version
      placeholder: iPhone 15 Pro, iOS 27.3
    validations:
      required: true
  - type: textarea
    id: trace
    attributes:
      label: Run trace
      description: Tool calls and results, or a summary of the run. Redact personal information such as account names, messages, and payment details first.
      render: text
    validations:
      required: true
