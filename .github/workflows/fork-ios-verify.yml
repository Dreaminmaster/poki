name: Fork iOS PR verification

on:
  workflow_dispatch:
  # Run only when this fork-local test definition changes on default branch.
  # No product-source pushes or upstream changes activate these costly macOS jobs.
  push:
    branches:
      - main
    paths:
      - .github/workflows/fork-ios-verify.yml

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 322
            ref: 93178eb2da195ab8e948fb58426ad95a1bcdc009
            tests: 'ModelSessionMetadataTests:12 ConnectionCheckTests:9 ChatHarnessTests:39 CustomModelDiscoveryTests:21'
          - pr: 322-baseline
            ref: 32aa5346c9a4c72bb03baa3306c5eb093da5696a
            tests: 'SessionRoutingBaselineTests:2'
    name: PR ${{ matrix.pr }}
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - name: Verify exact reviewed revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ matrix.ref }}
        run: |
          set -euo pipefail
          mkdir -p out
          git rev-parse HEAD | tee out/source-revision.txt
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Add test-only baseline regression probes
        if: matrix.pr == '322-baseline'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:ci/session-routing-baseline.swift" > native/ios-app/PokiTests/SessionRoutingBaselineTests.swift
          python3 - <<'PY'
          from pathlib import Path
          path = Path("native/ios-app/PokiTests/ConnectionCheckTests.swift")
          source = path.read_text()
          a = '        let body: Data\n        var json: [String: Any] {'
          b = '        let body: Data\n        let headers: [String: String]\n        var json: [String: Any] {'
          c = '            Self.recorded.append(Sent(url: request.url, body: body))'
          d = '''            let visible = Set(["x-opencode-session", "x-opencode-client", "user-agent"])
            let headers = (request.allHTTPHeaderFields ?? [:]).reduce(into: [String: String]()) { result, field in
                let name = field.key.lowercased()
                if visible.contains(name) { result[name] = field.value }
            }
            Self.recorded.append(Sent(url: request.url, body: body, headers: headers))'''
          assert source.count(a) == 1 and source.count(c) == 1, "unexpected base fixture shape"
          path.write_text(source.replace(a, b).replace(c, d))
          PY
          echo 'Baseline product SHA:' "$(git rev-parse HEAD)"
          git status --short
      - name: Select newest released Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE="$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          command -v xcodegen || brew install xcodegen
          mkdir -p out
          if ! command -v timeout >/dev/null && ! command -v gtimeout >/dev/null; then brew install coreutils; fi
      - name: Select and boot a fresh simulator before compiling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          xcrun simctl list -j > out/simctl-inventory.json
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          cat > /tmp/poki-history-select.py <<'PY'
          import json, re, sys
          
          def version(value):
              if not isinstance(value, str) or not re.fullmatch(r'\d+(?:\.\d+)*', value):
                  return None
              parts = tuple(int(part) for part in value.split('.'))
              return (parts + (0, 0, 0))[:3]
          
          def select(info, sdk_text):
              sdk = version(sdk_text)
              if sdk is None:
                  raise ValueError(f'Unexpected simulator SDK version {sdk_text!r}')
              types = {item['identifier']: item for item in info.get('devicetypes', []) if item.get('identifier')}
              runtimes = []
              for runtime in info.get('runtimes', []):
                  rver = version(runtime.get('version'))
                  identifier = runtime.get('identifier', '')
                  if runtime.get('isAvailable') and identifier.startswith('com.apple.CoreSimulator.SimRuntime.iOS-') and rver is not None and (18, 0, 0) <= rver <= sdk:
                      runtimes.append((rver, identifier, runtime))
              for _, identifier, runtime in sorted(runtimes, key=lambda item: item[:2], reverse=True):
                  phones = []
                  for device in info.get('devices', {}).get(identifier, []):
                      device_type = device.get('deviceTypeIdentifier')
                      if device.get('isAvailable') and device_type and device_type.startswith('com.apple.CoreSimulator.SimDeviceType.iPhone-'):
                          phones.append((device.get('name', ''), device_type))
                  if not phones:
                      for item in runtime.get('supportedDeviceTypes', []):
                          device_type = item if isinstance(item, str) else item.get('identifier')
                          if device_type and device_type.startswith('com.apple.CoreSimulator.SimDeviceType.iPhone-'):
                              phones.append((types.get(device_type, {}).get('name', device_type), device_type))
                  if phones:
                      phones.sort(key=lambda item: ('Pro' not in item[0], 'Max' in item[0], item[0]))
                      return phones[0][1], identifier
              raise ValueError(f'No compatible available iPhone simulator for SDK {sdk_text}')
          
          if __name__ == '__main__':
              info = json.load(sys.stdin)
              try:
                  print(*select(info, sys.argv[1]))
              except ValueError as error:
                  print(error, file=sys.stderr)
                  sys.exit(1)
          PY
          CHOICE="$(python3 /tmp/poki-history-select.py "$SDK" < out/simctl-inventory.json)"
          read -r TYPE RUNTIME <<< "$CHOICE"
          printf 'SDK %s\nDevice type %s\nRuntime %s\n' "$SDK" "$TYPE" "$RUNTIME" | tee out/simulator-selection.log
          UDID="$(xcrun simctl create "Poki review ${{ matrix.pr }}" "$TYPE" "$RUNTIME")"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b 2>&1 | tee out/simulator-boot.log
      - name: Verify core approval origin and cross-session isolation
        if: matrix.pr != '322-baseline'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          swift test --package-path native/ios/PokiCore --filter ApprovalTests.testSensitiveToolApprovalCarriesExactExternalCallerAndLocalSourceIsNil 2>&1 | tee out/core-approval-origin.log
          swift test --package-path native/ios/PokiCore --filter ApprovalTests.testApprovedSensitiveActionCannotBeReusedByAnotherMCPCaller 2>&1 | tee out/core-approval-cross-session.log
      - name: Build simulator launcher and assets
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if native/launcher/fetch-idevice.sh; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 10
          done
          rustup target add aarch64-apple-ios-sim
          cargo build --release --locked --target aarch64-apple-ios-sim --manifest-path native/launcher/Cargo.toml
          native/ios-app/scripts/make-assets.sh
          xcodegen generate --spec native/ios-app/project.yml
      - name: Build actual PokiTests and preserve complete logs
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build-for-testing -project native/ios-app/Poki.xcodeproj -scheme Poki \
            -destination "id=$UDID" -derivedDataPath build/history-review -jobs 2 \
            -resultBundlePath out/history-build.xcresult \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            2>&1 | tee out/build.log
      - name: Run required XCTest suites on exact revision
        if: matrix.pr != '322-baseline'
        shell: bash
        env:
          TEST_SUITES: ${{ matrix.tests }}
        run: |
          set -euo pipefail
          APP="build/history-review/Build/Products/Debug-iphonesimulator/Poki.app"
          BUNDLE="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl privacy "$UDID" grant location-always "$BUNDLE"
          TIMEOUT=$(command -v timeout || command -v gtimeout)
          for spec in $TEST_SUITES; do
            suite="${spec%%:*}"
            minimum="${spec##*:}"
            # Duo-only cases are excluded from this ordinary-iPhone validation.
            # Pass these fixed exclusions to every invocation. They are ignored by
            # non-scroll suites; unlike an empty array this is safe with macOS Bash
            # 3.2 under set -u (the previous runs failed before any tests started).
            "$TIMEOUT" 1800 xcodebuild test-without-building -project native/ios-app/Poki.xcodeproj -scheme Poki \
              -destination "id=$UDID" -derivedDataPath build/history-review \
              -only-testing:PokiTests/$suite \
              -skip-testing:PokiTests/ChatScrollTests/testHomeComposerKeepsItsMarginsInTheDuoLeftPane \
              -skip-testing:PokiTests/ChatScrollTests/testFoldedDuoHomeRespectsItsLeadingSafeArea \
              -skip-testing:PokiTests/ChatScrollTests/testDuoHomeRestoresItsLeadingSafeAreaWhenFoldedDuringACompanionTask \
              -parallel-testing-enabled NO \
              -resultBundlePath out/$suite.xcresult \
              CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
              2>&1 | tee "out/$suite.log"
            xcrun xcresulttool get test-results summary --path "out/$suite.xcresult" | tee "out/$suite.json"
            python3 - "$suite" "$minimum" <<'PY'
          import json, sys
          suite, minimum = sys.argv[1:]
          d = json.load(open(f"out/{suite}.json"))
          assert d["totalTestCount"] >= int(minimum), d
          assert d["failedTests"] == 0 and d["skippedTests"] == 0, d
          PY
          done
      - name: Verify both merge-base regressions fail for the missing session header
        if: matrix.pr == '322-baseline'
        shell: bash
        run: |
          set -uo pipefail
          APP="build/history-review/Build/Products/Debug-iphonesimulator/Poki.app"
          xcrun simctl install "$UDID" "$APP" || exit 1
          TIMEOUT=$(command -v timeout || command -v gtimeout)
          "$TIMEOUT" 600 xcodebuild test-without-building \
            -project native/ios-app/Poki.xcodeproj -scheme Poki \
            -destination "id=$UDID" -derivedDataPath build/history-review \
            -only-testing:PokiTests/SessionRoutingBaselineTests -parallel-testing-enabled NO \
            -resultBundlePath out/baseline.xcresult \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            2>&1 | tee out/baseline.log
          code=${PIPESTATUS[0]}
          if [ "$code" -eq 0 ]; then echo 'Baseline unexpectedly passed both session routing regressions'; exit 1; fi
          xcrun xcresulttool get test-results summary --path out/baseline.xcresult | tee out/baseline.json || exit 1
          python3 - <<'PY'
          import json
          d=json.load(open("out/baseline.json"))
          assert d["totalTestCount"] == 2, f"not both baseline tests executed: {d}"
          assert d["failedTests"] == 2 and d["skippedTests"] == 0, f"not both known regressions: {d}"
          PY
          if [ "$(grep -c 'missing x-opencode-session' out/baseline.log)" -lt 2 ]; then
            echo 'The two failures were not the expected missing routing headers'
            exit 1
          fi
          echo 'Both baseline regressions failed for missing session headers as expected.'
      - name: Preserve build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poki-pr-${{ matrix.pr }}-results
          path: out/
          if-no-files-found: warn
      - name: Delete only the temporary simulator
        if: always()
        shell: bash
        run: |
          if [ -n "${UDID:-}" ]; then
            xcrun simctl shutdown "$UDID" || true
            xcrun simctl delete "$UDID" || true
          fi
