name: Fork iOS PR verification

on:
  workflow_dispatch:
  # Keep verification isolated from main's automatic Pre-alpha publishing workflow.
  # Run only for this dedicated fork-local verification branch.
  push:
    branches:
      - ci/search-consistency
    paths:
      - .github/workflows/fork-ios-verify.yml

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: current-main-complete-candidate
            device: iPhone
            ref: d3ada62883d2994f141c94e7a9a7690e2dad2754
            tests: 'ConversationSearchTests:21 SessionArchiveTests:21 SessionBackupRestoreTests:3 ChatScrollTests:10'
            ui_tests: 'testConversationSearchOpensNormalMessageAtExactHit testNarrowMemorySourceOpensActualTranscriptWithoutReplacingDraft testConversationSearchRevealsSelectedGreetingOnly'
            expected_baseline: false
          - pr: current-main-complete-candidate
            device: iPad
            ref: d3ada62883d2994f141c94e7a9a7690e2dad2754
            tests: 'ConversationSearchTests:21 SessionArchiveTests:21 SessionBackupRestoreTests:3 ChatScrollTests:10'
            ui_tests: 'testConversationSearchOpensNormalMessageAtExactHit testWideMemorySourceOpensActualTranscriptWithoutReplacingDraft testConversationSearchRevealsSelectedGreetingOnly'
            expected_baseline: false
    name: PR ${{ matrix.pr }} (${{ matrix.device }})
    runs-on: xcode-27
    # 0.5.0 adds the pinned Codex Voice Rust workspace to the first clean build.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - name: Verify exact reviewed revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ matrix.ref }}
        run: |
          set -euo pipefail
          mkdir -p out
          git rev-parse HEAD | tee out/source-revision.txt
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Select newest released Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE="$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          command -v xcodegen || brew install xcodegen
          mkdir -p out
          if ! command -v timeout >/dev/null && ! command -v gtimeout >/dev/null; then brew install coreutils; fi
      - name: Select and boot a fresh simulator before compiling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          xcrun simctl list -j > out/simctl-inventory.json
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          cat > /tmp/poki-history-select.py <<'PY'
          import json, re, sys
          
          def version(value):
              if not isinstance(value, str) or not re.fullmatch(r'\d+(?:\.\d+)*', value):
                  return None
              parts = tuple(int(part) for part in value.split('.'))
              return (parts + (0, 0, 0))[:3]
          
          def select(info, sdk_text):
              sdk = version(sdk_text)
              if sdk is None:
                  raise ValueError(f'Unexpected simulator SDK version {sdk_text!r}')
              types = {item['identifier']: item for item in info.get('devicetypes', []) if item.get('identifier')}
              runtimes = []
              for runtime in info.get('runtimes', []):
                  rver = version(runtime.get('version'))
                  identifier = runtime.get('identifier', '')
                  if runtime.get('isAvailable') and identifier.startswith('com.apple.CoreSimulator.SimRuntime.iOS-') and rver is not None and (18, 0, 0) <= rver <= sdk:
                      runtimes.append((rver, identifier, runtime))
              for _, identifier, runtime in sorted(runtimes, key=lambda item: item[:2], reverse=True):
                  # The Duo has a separate runtime and can report a folded/companion
                  # viewport. It is not a conventional phone; reserve it for Duo tests.
                  if sys.argv[2] == 'iPhone' and '-iPhone19-4' in identifier:
                      continue
                  phones = []
                  for device in info.get('devices', {}).get(identifier, []):
                      device_type = device.get('deviceTypeIdentifier')
                      if device.get('isAvailable') and device_type and (device_type.startswith('com.apple.CoreSimulator.SimDeviceType.' + sys.argv[2] + '-') and not (sys.argv[2] == 'iPhone' and device_type == 'com.apple.CoreSimulator.SimDeviceType.iPhone-Duo')):
                          phones.append((device.get('name', ''), device_type))
                  if not phones:
                      for item in runtime.get('supportedDeviceTypes', []):
                          device_type = item if isinstance(item, str) else item.get('identifier')
                          if device_type and (device_type.startswith('com.apple.CoreSimulator.SimDeviceType.' + sys.argv[2] + '-') and not (sys.argv[2] == 'iPhone' and device_type == 'com.apple.CoreSimulator.SimDeviceType.iPhone-Duo')):
                              phones.append((types.get(device_type, {}).get('name', device_type), device_type))
                  if phones:
                      phones.sort(key=lambda item: ('Pro' not in item[0], 'Max' in item[0], item[0]))
                      return phones[0][1], identifier
              raise ValueError(f'No compatible available {sys.argv[2]} simulator for SDK {sdk_text}')
          
          if __name__ == '__main__':
              info = json.load(sys.stdin)
              try:
                  print(*select(info, sys.argv[1]))
              except ValueError as error:
                  print(error, file=sys.stderr)
                  sys.exit(1)
          PY
          CHOICE="$(python3 /tmp/poki-history-select.py "$SDK" "${{ matrix.device }}" < out/simctl-inventory.json)"
          if [ "${{ matrix.device }}" = iPhone ] && [[ "$CHOICE" == *iPhone-Duo* ]]; then
            echo "::error::A conventional iPhone job must not select iPhone Duo"
            exit 1
          fi
          read -r TYPE RUNTIME <<< "$CHOICE"
          printf 'SDK %s\nDevice type %s\nRuntime %s\n' "$SDK" "$TYPE" "$RUNTIME" | tee out/simulator-selection.log
          UDID="$(xcrun simctl create "Poki review ${{ matrix.pr }}" "$TYPE" "$RUNTIME")"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b 2>&1 | tee out/simulator-boot.log
      - name: Verify Core approval origin and preserve original one-time retry
        if: matrix.pr == 322
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          swift test --package-path native/ios/PokiCore --filter ApprovalTests.testSensitiveToolApprovalCarriesExactExternalCallerAndLocalSourceIsNil 2>&1 | tee out/core-approval-origin.log
          swift test --package-path native/ios/PokiCore --filter ApprovalTests.testLiveVoiceDoApprovalHasNoExternalSource 2>&1 | tee out/core-live-voice-origin.log
          swift test --package-path native/ios/PokiCore --filter ApprovalTests.testADeletionWaitsForTheOwnerAndSendsNothing 2>&1 | tee out/core-legacy-approval-retry.log
      - name: Build simulator launcher and assets
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if native/launcher/fetch-idevice.sh; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 10
          done
          rustup target add aarch64-apple-ios-sim
          cargo build --release --locked --target aarch64-apple-ios-sim --manifest-path native/launcher/Cargo.toml
          native/ios-app/scripts/make-assets.sh
          xcodegen generate --spec native/ios-app/project.yml
      - name: Identify Codex Voice cache inputs
        id: voice-cache
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$( { xcodebuild -version; xcrun --sdk iphonesimulator --show-sdk-version; rustc +stable -Vv; } | shasum -a 256 | cut -d' ' -f1)"
          # The checkout is pinned and verified above. Git's tree ID includes
          # every tracked input under this directory without scanning the build
          # output or invoking the runner's time-limited hashFiles glob.
          git diff --quiet HEAD -- native/codex-voice
          inputs="$(git rev-parse HEAD:native/codex-voice)"
          test "$(git cat-file -t "$inputs")" = tree
          echo "key=codex-voice-sim-v2-$toolchain-$inputs" >> "$GITHUB_OUTPUT"
      - name: Restore exact Codex Voice simulator library
        id: voice-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            build/codex-voice/aarch64-apple-ios-sim/target/aarch64-apple-ios-sim/release/libpoki_codex_voice.a
            build/codex-voice/aarch64-apple-ios-sim/target/aarch64-apple-ios-sim/release/libpoki_codex_voice.a.sha256
          key: ${{ steps.voice-cache.outputs.key }}
      - name: Build pinned Codex Voice dependency separately
        shell: bash
        run: |
          set -euo pipefail
          native/codex-voice/build.sh build aarch64-apple-ios-sim 2>&1 | tee out/codex-voice-build.log
      - name: Check the Codex Voice build stamp before Xcode
        shell: bash
        run: |
          set -euo pipefail
          LIB=build/codex-voice/aarch64-apple-ios-sim/target/aarch64-apple-ios-sim/release/libpoki_codex_voice.a
          test -s "$LIB"
          test -s "$LIB.sha256"
          native/codex-voice/build.sh build aarch64-apple-ios-sim | tee out/codex-voice-stamp.log
          grep -F 'is up to date (cached).' out/codex-voice-stamp.log
      - name: Save verified Codex Voice simulator library
        if: steps.voice-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/codex-voice/aarch64-apple-ios-sim/target/aarch64-apple-ios-sim/release/libpoki_codex_voice.a
            build/codex-voice/aarch64-apple-ios-sim/target/aarch64-apple-ios-sim/release/libpoki_codex_voice.a.sha256
          key: ${{ steps.voice-cache.outputs.key }}
      - name: Build actual PokiTests and preserve complete logs
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build-for-testing -project native/ios-app/Poki.xcodeproj -scheme Poki \
            -destination "id=$UDID" -derivedDataPath build/history-review -jobs 2 \
            -resultBundlePath out/history-build.xcresult \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            2>&1 | tee out/build.log
      - name: Run required XCTest suites on exact revision
        if: matrix.expected_baseline != true
        shell: bash
        env:
          TEST_SUITES: ${{ matrix.tests }}
        run: |
          set -euo pipefail
          APP="build/history-review/Build/Products/Debug-iphonesimulator/Poki.app"
          BUNDLE="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl privacy "$UDID" grant location-always "$BUNDLE"
          TIMEOUT=$(command -v timeout || command -v gtimeout)
          for spec in $TEST_SUITES; do
            suite="${spec%%:*}"
            minimum="${spec##*:}"
            # Duo-only cases are excluded from this ordinary-iPhone validation.
            # Pass these fixed exclusions to every invocation. They are ignored by
            # non-scroll suites; unlike an empty array this is safe with macOS Bash
            # 3.2 under set -u (the previous runs failed before any tests started).
            "$TIMEOUT" 1800 xcodebuild test-without-building -project native/ios-app/Poki.xcodeproj -scheme Poki \
              -destination "id=$UDID" -derivedDataPath build/history-review \
              -only-testing:PokiTests/$suite \
              -skip-testing:PokiTests/ChatScrollTests/testHomeComposerKeepsItsMarginsInTheDuoLeftPane \
              -skip-testing:PokiTests/ChatScrollTests/testFoldedDuoHomeRespectsItsLeadingSafeArea \
              -skip-testing:PokiTests/ChatScrollTests/testDuoHomeRestoresItsLeadingSafeAreaWhenFoldedDuringACompanionTask \
              -parallel-testing-enabled NO \
              -resultBundlePath out/$suite.xcresult \
              CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
              2>&1 | tee "out/$suite.log"
            xcrun xcresulttool get test-results summary --path "out/$suite.xcresult" | tee "out/$suite.json"
            python3 - "$suite" "$minimum" <<'PY'
          import json, sys
          suite, minimum = sys.argv[1:]
          d = json.load(open(f"out/{suite}.json"))
          assert d["totalTestCount"] == int(minimum), d
          assert d["failedTests"] == 0 and d["skippedTests"] == 0, d
          PY
          done
      - name: Confirm unpatched implementation fails the exact retry assertions
        if: matrix.expected_baseline == true
        shell: bash
        run: |
          set -euo pipefail
          APP="build/history-review/Build/Products/Debug-iphonesimulator/Poki.app"
          BUNDLE="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl privacy "$UDID" grant location-always "$BUNDLE"
          TIMEOUT=$(command -v timeout || command -v gtimeout)
          set +e
          "$TIMEOUT" 1800 xcodebuild test-without-building -project native/ios-app/Poki.xcodeproj -scheme Poki \
            -destination "id=$UDID" -derivedDataPath build/history-review \
            -only-testing:PokiTests/SessionArchiveTests/testScopedFlushRetriesItsOwnFailedWrite \
            -only-testing:PokiTests/SessionArchiveTests/testScopedFlushRetriesOnlyRequestedFailedSave \
            -parallel-testing-enabled NO -resultBundlePath out/scoped-baseline.xcresult \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            2>&1 | tee out/scoped-baseline.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" = 65
          xcrun xcresulttool get test-results summary --path out/scoped-baseline.xcresult | tee out/scoped-baseline.json
          python3 - <<'PY'
          import json
          d = json.load(open("out/scoped-baseline.json"))
          log = open("out/scoped-baseline.log").read()
          assert d["totalTestCount"] == 2 and d["failedTests"] == 2 and d["skippedTests"] == 0, d
          for name in ("testScopedFlushRetriesItsOwnFailedWrite", "testScopedFlushRetriesOnlyRequestedFailedSave"):
              assert name in json.dumps(d.get("testFailures", [])), d
          assert "XCTUnwrap failed" in log, log[-4000:]
          assert "An explicit scoped flush must retry an earlier failed write" in log, log[-4000:]
          print("Both expected old-code assertion failures reproduced; this is a negative baseline, not passing application tests.")
          PY
      - name: Verify actual conversation search and Memory source taps
        if: matrix.ui_tests != ''
        shell: bash
        env:
          UI_CASES: ${{ matrix.ui_tests }}
        run: |
          set -euo pipefail
          TIMEOUT=$(command -v timeout || command -v gtimeout)
          failures=0
          for case_name in $UI_CASES; do
            set +e
            "$TIMEOUT" 1800 xcodebuild test-without-building -project native/ios-app/Poki.xcodeproj -scheme Poki \
              -destination "id=$UDID" -derivedDataPath build/history-review \
              -only-testing:PokiUITests/MemorySourceNavigationUITests/$case_name \
              -parallel-testing-enabled NO \
              -resultBundlePath "out/ui-$case_name.xcresult" \
              CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
              2>&1 | tee "out/ui-$case_name.log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" = 0 ] && xcrun xcresulttool get test-results summary --path "out/ui-$case_name.xcresult" > "out/ui-$case_name.json" && python3 - "$case_name" <<'PY'
          import json, sys
          case = sys.argv[1]
          d = json.load(open(f"out/ui-{case}.json"))
          assert d["totalTestCount"] == 1, (case, d)
          assert d["passedTests"] == 1 and d["failedTests"] == 0 and d["skippedTests"] == 0, (case, d)
          PY
            then
              echo "$case_name: passed"
            else
              failures=$((failures + 1))
              echo "::error::$case_name did not pass (xcodebuild status $status)"
              if [ -d "out/ui-$case_name.xcresult" ]; then
                xcrun xcresulttool get test-results summary --path "out/ui-$case_name.xcresult" > "out/ui-$case_name.json" || true
              fi
              xcrun simctl io "$UDID" screenshot "out/ui-$case_name-failure.png" || true
              "$TIMEOUT" 120 xcrun simctl spawn "$UDID" log show --last 5m --style compact \
                --predicate 'process == "Poki" OR process == "testmanagerd" OR process == "SpringBoard"' \
                > "out/ui-$case_name-simulator.log" 2>&1 || true
            fi
          done
          test "$failures" = 0
      - name: Capture simulator diagnostics on any failure
        if: failure()
        shell: bash
        run: |
          if [ -n "${UDID:-}" ]; then
            xcrun simctl io "$UDID" screenshot out/failure-screen.png || true
            TIMEOUT=$(command -v timeout || command -v gtimeout)
            "$TIMEOUT" 120 xcrun simctl spawn "$UDID" log show --last 10m --style compact \
              --predicate 'process == "Poki" OR process == "testmanagerd" OR process == "SpringBoard"' \
              > out/failure-simulator.log 2>&1 || true
          fi
      - name: Preserve build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poki-pr-${{ matrix.pr }}-${{ matrix.device }}-results
          path: out/
          if-no-files-found: warn
      - name: Delete only the temporary simulator
        if: always()
        shell: bash
        run: |
          if [ -n "${UDID:-}" ]; then
            xcrun simctl shutdown "$UDID" || true
            xcrun simctl delete "$UDID" || true
          fi
