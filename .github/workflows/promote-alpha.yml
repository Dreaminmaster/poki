# Promote to Alpha: Actions > Promote to Alpha > Run workflow. Takes a pre-alpha (by default the one
# on app-prealpha-latest), runs the alpha tests on its commit, and when they pass puts that same IPA
# (not a rebuild) into the rolling app-alpha-latest release (and the old ios-alpha-latest) with the
# tag app-<VERSION>-alpha.<build>.
# Testers on the Alpha channel get exactly the file that was tried on Pre-alpha.
name: Promote to Alpha

on:
  workflow_dispatch:
    inputs:
      prealpha:
        description: "Pre-alpha tag to promote, like app-0.3.0-prealpha.712 (empty: the one on app-prealpha-latest)"
        type: string
        required: false
        default: ''
      hotfix:
        description: "Promote a versioned hotfix Pre-alpha (also provide its tag)"
        type: boolean
        required: false
        default: false

concurrency:
  group: promote-alpha
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.r.outputs.sha }}
      version: ${{ steps.r.outputs.version }}
      build: ${{ steps.r.outputs.build }}
      run: ${{ steps.r.outputs.run }}
      ipa_sha256: ${{ steps.r.outputs.ipa_sha256 }}
    steps:
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WANT: ${{ inputs.prealpha }}
          HOTFIX: ${{ inputs.hotfix }}
        run: |
          set -euo pipefail
          if [ "$HOTFIX" = true ] && [ -z "$WANT" ]; then
            echo "::error::a hotfix promotion requires its explicit Pre-alpha tag"; exit 1
          fi
          if [ -z "$WANT" ]; then
            ipa="$(gh release view app-prealpha-latest --json assets --jq '.assets[].name' | grep -E '^Poki-external-.*\.ipa$' | head -1)"
            stem="${ipa#Poki-external-}"; stem="${stem%.ipa}"
            WANT="app-${stem%-*}-prealpha.${stem##*-}"
          fi
          [[ "$WANT" =~ ^app-([0-9]+\.[0-9]+\.[0-9]+)-prealpha\.([0-9]+)$ ]] || { echo "::error::$WANT is not app-X.Y.Z-prealpha.N"; exit 1; }
          version="${BASH_REMATCH[1]}" build="${BASH_REMATCH[2]}"
          sha="$(gh api "repos/$GH_REPO/commits/$WANT" --jq .sha)"
          ipa_sha=""
          if [ "$HOTFIX" = true ]; then
            # The run title narrows the search. The source artifact proves what it built.
            candidates="$(gh api --paginate "repos/$GH_REPO/actions/workflows/prealpha.yml/runs?branch=main&event=workflow_dispatch&status=success&per_page=100" |
              jq -sr --arg title "Hotfix Pre-alpha $version ($build)" '
                [.[].workflow_runs[] | select(.head_branch == "main" and .event == "workflow_dispatch"
                  and .conclusion == "success" and .display_title == $title)]
                | sort_by(.run_number) | reverse | .[].id
              ')"
            run=""
            while IFS= read -r candidate; do
              [[ "$candidate" =~ ^[1-9][0-9]*$ ]] || continue
              gh run download "$candidate" --repo "$GH_REPO" --name Poki-hotfix-source --dir "provenance/$candidate"
              if ipa_sha="$(jq -er --arg sha "$sha" --arg version "$version" --arg build "$build" '
                  select(.sha == $sha and .version == $version and .build == $build)
                  | .ipa_sha256 | select(test("^[0-9a-f]{64}$"))
                ' "provenance/$candidate/poki-hotfix-source.json")"; then
                run="$candidate"
                break
              fi
            done <<< "$candidates"
            [ -n "$run" ] || { echo "::error::no successful hotfix Pre-alpha run matches $WANT ($sha)"; exit 1; }
          else
            # A manual hotfix run's workflow head is main, even though it built a different commit.
            run="$(gh run list --workflow prealpha.yml --branch main --event push --commit "$sha" --status success --json databaseId --jq '.[0].databaseId')"
            [ -n "$run" ] || { echo "::error::no successful automatic Pre-alpha run built $sha; for a hotfix, enable the hotfix input"; exit 1; }
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/app-$version-alpha.$build" >/dev/null 2>&1; then
            echo "::error::app-$version-alpha.$build already exists"; exit 1
          fi
          echo "Promoting $WANT ($sha), Pre-alpha run $run"
          { echo "sha=$sha"; echo "version=$version"; echo "build=$build"; echo "run=$run"; echo "ipa_sha256=$ipa_sha"; } >> "$GITHUB_OUTPUT"
          echo "## Promote $WANT to Alpha" >> "$GITHUB_STEP_SUMMARY"

  # The alpha tests on the pre-alpha's commit: PokiCore and loopback tests, the in-process field,
  # apps and idle-cycle checks, the simulator smoke test, and Poki's agent end to end with a
  # scripted model. Three macOS jobs.
  ios-tests:
    needs: resolve
    uses: ./.github/workflows/ios-app.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      build: ${{ needs.resolve.outputs.build }}
      ref: ${{ needs.resolve.outputs.sha }}

  # Poki Setup's core (release picking, pairing, signing) on Linux.
  desktop-tests:
    needs: resolve
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.resolve.outputs.sha }}" }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop }
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo test -p poki-setup-core -p poki-setup-cli --manifest-path desktop/Cargo.toml
        env: { POKI_SETUP_FILE_SECRETS: "1" }

  publish:
    needs: [resolve, ios-tests, desktop-tests]
    runs-on: ubuntu-latest
    environment: alpha
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.resolve.outputs.sha }}", fetch-depth: 0, filter: 'tree:0' }
      # The publishing script from this workflow's commit, so older pre-alphas can be promoted too.
      - uses: actions/checkout@v4
        with: { path: pipeline, sparse-checkout: .github/scripts }
      - name: The pre-alpha's IPA
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.resolve.outputs.run }}
          IPA_SHA: ${{ needs.resolve.outputs.ipa_sha256 }}
          VERSION: ${{ needs.resolve.outputs.version }}
          BUILD: ${{ needs.resolve.outputs.build }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --name Poki-unsigned --dir app
          if [ -n "$IPA_SHA" ]; then
            printf '%s  %s\n' "$IPA_SHA" app/Poki-external-unsigned.ipa | sha256sum -c -
          fi
          python3 pipeline/.github/scripts/verify-ipa-version.py app/Poki-external-unsigned.ipa "$VERSION" "$BUILD"
      - name: Publish to app-alpha-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipeline/.github/scripts/publish-rolling.sh alpha "${{ needs.resolve.outputs.version }}" "${{ needs.resolve.outputs.build }}" app app-prealpha-latest
