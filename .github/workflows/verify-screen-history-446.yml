name: Screen History revocation verification (temporary)

on:
  push:
    branches:
      - ci/screen-history-446-check

permissions:
  contents: read

jobs:
  test:
    name: ScreenHistoryTests on Xcode 27
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode and install generator
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          brew install xcodegen

      - name: Build the simulator launcher
        run: |
          set -euo pipefail
          native/launcher/fetch-idevice.sh
          rustup target add aarch64-apple-ios-sim
          cargo build --release --locked --target aarch64-apple-ios-sim --manifest-path native/launcher/Cargo.toml

      - name: Prepare assets
        run: |
          set -euo pipefail
          native/ios-app/scripts/make-assets.sh

      - name: Boot an iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          devices=json.load(sys.stdin)["devices"]
          phones=[x for group in devices.values() for x in group if x.get("isAvailable") and "iPhone" in x.get("name","")]
          pro=[x for x in phones if "Pro" in x["name"] and "Max" not in x["name"]]
          if not (pro or phones): raise SystemExit("No iPhone simulator available")
          print((pro or phones)[0]["udid"])
          ')"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Run repository's iOS simulator XCTest harness
        shell: bash
        run: |
          set -euo pipefail
          native/ios-app/scripts/app-tests.sh "$UDID"
