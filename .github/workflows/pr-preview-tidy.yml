# Deletes preview builds (the Poki-preview-pr<N>-... artifacts that pr-preview.yml makes). After a
# pull request's preview is built, its earlier builds go, so each pull request offers one. When the
# `preview` label comes off, or the pull request is merged or closed, all of its builds go: a merged
# change is in the next pre-alpha, and Poki and Poki Setup return to their channel by themselves.
#
# Deleting artifacts needs write access to Actions, so this is kept apart from pr-preview.yml,
# which runs the pull request's own copy of itself. Both triggers here (workflow_run and
# pull_request_target) always run the copy of this file on main, and it never checks out or runs
# the pull request's code. Every value from the event reaches the scripts through env, never
# written into them. Because GitHub runs main's copy, this works once it is on main.
#
# Which pull request's builds go is never read from an artifact's name, since the pull request's
# own copy of pr-preview.yml chooses those. On pull_request_target the number is the event's. After
# a preview run it is the one open pull request of this repository whose branch is the run's
# branch (asked of GitHub); with none or more than one, nothing goes. Then only that pull request's
# builds that are older than the ones this run uploaded under its name are deleted.
name: PR preview tidy

on:
  workflow_run:
    workflows: ["PR preview"]
    types: [completed]
  pull_request_target:
    types: [closed, unlabeled]

permissions: {}

jobs:
  tidy:
    name: tidy
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.event == 'pull_request'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.head_repository.full_name == github.repository)
      || (github.event_name == 'pull_request_target'
        && github.event.pull_request.head.repo.full_name == github.repository
        && (github.event.action == 'closed'
          || (github.event.action == 'unlabeled' && github.event.label.name == 'preview')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    concurrency:
      group: pr-preview-tidy-${{ github.event.pull_request.number || github.event.workflow_run.id }}
    steps:
      - name: Delete the builds that are replaced or no longer wanted
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          CLOSED_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_run ]; then
            [ "$HEAD_REPO" = "$GH_REPO" ] || { echo "Run $RUN_ID built another repository's branch."; exit 0; }
            # The pull request is the open one whose branch the run built. The branch name is the
            # pull request author's text, so it only ever goes in as a request field and a jq value.
            gh api -X GET "repos/$GH_REPO/pulls" -f state=open -f head="${GH_REPO%%/*}:$HEAD_BRANCH" -F per_page=100 \
              | jq -r --arg repo "$GH_REPO" --arg branch "$HEAD_BRANCH" '.[] | select(.head.repo.full_name == $repo and .head.ref == $branch) | .number' > prs.txt
            if [ "$(grep -c . prs.txt || true)" -ne 1 ]; then echo "Run $RUN_ID is not the branch of exactly one open pull request; nothing is deleted."; exit 0; fi
            PR="$(cat prs.txt)"
            echo "$PR" | grep -Eq '^[0-9]+$' || { echo "::error::No pull request number."; exit 1; }
            # Only builds older than the ones this run uploaded under that pull request's name go,
            # so a slower run cannot delete a newer build. A run that uploaded none deletes nothing.
            OLDEST_KEPT="$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts?per_page=100" --paginate \
              | jq -r --arg prefix "Poki-preview-pr$PR-" '.artifacts[] | select(.name | startswith($prefix)) | .id' | sort -n | head -1)"
            if [ -z "$OLDEST_KEPT" ]; then echo "Run $RUN_ID made no preview build of pull request $PR."; exit 0; fi
          else
            PR="$CLOSED_PR"
            RUN_ID=""
            OLDEST_KEPT=""
            echo "$PR" | grep -Eq '^[0-9]+$' || { echo "::error::No pull request number."; exit 1; }
          fi
          gh api "repos/$GH_REPO/actions/artifacts?per_page=100" --paginate \
            | jq -r --arg prefix "Poki-preview-pr$PR-" --arg run "$RUN_ID" --arg below "$OLDEST_KEPT" '
                .artifacts[]
                | select(.name | startswith($prefix))
                | select($run == "" or (.workflow_run.id | tostring) != $run)
                | select($below == "" or .id < ($below | tonumber))
                | .id' \
            | while read -r id; do
                gh api -X DELETE "repos/$GH_REPO/actions/artifacts/$id" && echo "Deleted preview artifact $id"
              done
