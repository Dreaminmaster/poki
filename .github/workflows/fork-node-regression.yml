name: Fork Node regression verification
on:
  push:
    branches: [ci/search-consistency]
    paths: [.github/workflows/fork-node-regression.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Control: same source baseline and same root-only install as the failed runs.
          - candidate: upstream-linux-control
            ref: d6c4e92fdb3257c727884e9fce5bac232bf70d2b
            agent_dependencies: false
          # Diagnose the separate Agent dependency omission without modifying application code.
          - candidate: upstream-linux-with-agent
            ref: d6c4e92fdb3257c727884e9fce5bac232bf70d2b
            agent_dependencies: true
    name: npm test - ${{ matrix.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - name: Verify exact source revision
        env:
          EXPECTED_SHA: ${{ matrix.ref }}
        run: |
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Install Agent dependencies when selected
        if: matrix.agent_dependencies == true
        run: npm ci --prefix agent
      - name: Required repository tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee node-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-test-${{ matrix.candidate }}
          path: node-test.log
          if-no-files-found: ignore
