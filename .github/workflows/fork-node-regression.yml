name: Fork macOS Node regression verification
on:
  push:
    branches: [ci/search-consistency]
    paths: [.github/workflows/fork-node-regression.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reduced-concurrency-control:
    # Use the same toolchain and candidate as the previous full test.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d8d235038473a180b9c41a93e68a923f778a3c49
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact source and compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          git rev-parse HEAD | tee out/source-revision.txt
          test "$(git rev-parse HEAD)" = d8d235038473a180b9c41a93e68a923f778a3c49
          XCODE="$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          { sw_vers; xcodebuild -version; swiftc --version; node --version; sysctl -n hw.ncpu; } | tee out/environment.txt
      - run: npm ci
      - run: npm ci --prefix agent
      - name: Controlled full-suite comparison at two workers
        shell: bash
        run: |
          set -uo pipefail
          set +e
          node --test --test-concurrency=2 test/*.test.mjs 2>&1 | tee out/node-test-two-workers.log
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > out/two-workers-status.txt
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-two-worker-control-d8d2350
          path: out/
          if-no-files-found: error
