name: Fork macOS Node regression verification
on:
  push:
    branches: [ci/search-consistency]
    paths: [.github/workflows/fork-node-regression.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recording-phase:
    runs-on: xcode-27
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: explicit-phase
            ref: 8054a0acdd67305b1a96ebe3e84cfd57567a285b
            negative: false
          - label: substring-control
            ref: 4949cad1238f8d074293f1d231cb69963918a0a5
            negative: true
    name: Recording phase log collision - ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact source and install dependencies
        shell: bash
        env:
          EXPECTED: ${{ matrix.ref }}
        run: |
          set -euo pipefail
          mkdir -p out
          git rev-parse HEAD | tee out/source-revision.txt
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          npm ci
      - name: Verify ordinary cancellation and command-text collision
        shell: bash
        env:
          NEGATIVE: ${{ matrix.negative }}
        run: |
          set -euo pipefail
          set +e
          node --test --test-concurrency=1 --test-name-pattern='^cancel during recording recovery preserves dispatched input and finishes cleanup before takeover' test/coordination.test.mjs 2>&1 | tee out/regression.log
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > out/status.txt
          grep -Fxq 'ℹ tests 2' out/regression.log
          grep -Fxq 'ℹ skipped 0' out/regression.log
          if [ "$NEGATIVE" = true ]; then
            test "$status" = 1
            grep -Fxq 'ℹ pass 1' out/regression.log
            grep -Fxq 'ℹ fail 1' out/regression.log
            grep -F '✖ cancel during recording recovery preserves dispatched input and finishes cleanup before takeover (command text in input)' out/regression.log
            grep -F 'Timed out waiting for a command in the fixture log' out/regression.log
          else
            test "$status" = 0
            grep -Fxq 'ℹ pass 2' out/regression.log
            grep -Fxq 'ℹ fail 0' out/regression.log
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recording-log-collision-${{ matrix.label }}
          path: out/
          if-no-files-found: error
