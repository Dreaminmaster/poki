name: Fork macOS Node regression verification
on:
  push:
    branches: [ci/search-consistency]
    paths: [.github/workflows/fork-node-regression.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recording-phase:
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: original
            ref: 226771994f07fc19ba8fb179cb0364c4e12b50c6
          - label: explicit-phase
            ref: 537a7c3826596502a51ab18228f478bb2d8cf75c
    name: Recording cancellation - ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact source and install dependencies
        shell: bash
        env:
          EXPECTED: ${{ matrix.ref }}
        run: |
          set -euo pipefail
          mkdir -p out
          git rev-parse HEAD | tee out/source-revision.txt
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          node --version | tee out/node-version.txt
          npm ci
      - name: Repeat recording recovery cases without changing deadlines
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          for i in 1 2 3 4 5; do
            set +e
            node --test --test-concurrency=1 --test-name-pattern='^(cancel during recording recovery preserves dispatched input|input receipt survives recording recovery failure|healthy recording survives more than four inputs|automatic recording retries remain bounded)' test/coordination.test.mjs 2>&1 | tee "out/repeat-$i.log"
            status=${PIPESTATUS[0]}
            set -e
            printf '%s\n' "$status" > "out/repeat-$i.status"
            if [ "$status" != 0 ] || ! grep -Fxq 'ℹ tests 4' "out/repeat-$i.log" || ! grep -Fxq 'ℹ pass 4' "out/repeat-$i.log"; then failures=$((failures+1)); fi
          done
          printf 'failed_iterations=%s\n' "$failures" | tee out/summary.txt
          test "$failures" = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recording-phase-${{ matrix.label }}
          path: out/
          if-no-files-found: error
