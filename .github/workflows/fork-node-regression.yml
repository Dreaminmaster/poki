name: Fork macOS Node regression verification
on:
  push:
    branches: [ci/search-consistency]
    paths: [.github/workflows/fork-node-regression.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full:
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: verified-fixes-integration
            ref: 764fa721e610dc7b2bc159651cdd065f28379dfd
    name: Required npm test - ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact revision and toolchain
        shell: bash
        env:
          EXPECTED: ${{ matrix.ref }}
        run: |
          set -euo pipefail
          mkdir -p out
          git rev-parse HEAD | tee out/source-revision.txt
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          XCODE="$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          { sw_vers; xcodebuild -version; swiftc --version; node --version; } | tee out/environment.txt
      - run: npm ci
      - run: npm ci --prefix agent
      - name: Required full repository suite
        shell: bash
        run: |
          set -o pipefail
          set +e
          npm test 2>&1 | tee out/node-test.log
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > out/status.txt
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-node-${{ matrix.label }}
          path: out/
          if-no-files-found: error
