name: Fork macOS Node regression verification
on:
  push:
    branches: [ci/search-consistency]
    paths: [.github/workflows/fork-node-regression.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - candidate: upstream-newest-xcode
            ref: 059388bd20766090344fe660078094e55726f6fe
            agent_dependencies: true
          - candidate: notification-fixture-newest-xcode
            ref: d8d235038473a180b9c41a93e68a923f778a3c49
            agent_dependencies: true
    name: npm test - ${{ matrix.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - name: Verify exact source revision
        env:
          EXPECTED_SHA: ${{ matrix.ref }}
        run: |
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Select newest released Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE="$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          swiftc --version
      - name: Verify macOS prerequisites
        run: |
          sw_vers
          xcodebuild -version
          command -v plutil
          swift -e 'import CryptoKit; print("CryptoKit available")'
      - run: npm ci
      - name: Install Agent dependencies when selected
        if: matrix.agent_dependencies == true
        run: npm ci --prefix agent
      - name: Required repository tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee node-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-test-${{ matrix.candidate }}
          path: node-test.log
          if-no-files-found: ignore
