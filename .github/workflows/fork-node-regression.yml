name: Fork macOS Node regression verification
on:
  push:
    branches: [ci/search-consistency]
    paths: [.github/workflows/fork-node-regression.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9b1b965675b8da531ca0a24b1ff73c8dbb69d8d8
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact revision and install dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          git rev-parse HEAD | tee out/source-revision.txt
          test "$(git rev-parse HEAD)" = 9b1b965675b8da531ca0a24b1ff73c8dbb69d8d8
          XCODE="$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version | tee out/xcode-version.txt
          node --version | tee out/node-version.txt
          npm ci
          npm ci --prefix agent
      - name: Required full repository suite
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee out/full-node.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-main-fixture-integration
          path: out/
          if-no-files-found: error
