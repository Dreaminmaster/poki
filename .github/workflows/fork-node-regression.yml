name: Fork macOS Node regression verification
on:
  push:
    branches: [ci/search-consistency]
    paths: [.github/workflows/fork-node-regression.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full:
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: verified-fixes-integration
            ref: 7cf55624bfd489bcae502b495af94001b07e62b5
    name: Required npm test - ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact revision and toolchain
        shell: bash
        env:
          EXPECTED: ${{ matrix.ref }}
        run: |
          set -euo pipefail
          mkdir -p out
          git rev-parse HEAD | tee out/source-revision.txt
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          XCODE="$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          { sw_vers; xcodebuild -version; swiftc --version; node --version; } | tee out/environment.txt
      - run: npm ci
      - run: npm ci --prefix agent
      - name: Required full repository suite
        shell: bash
        run: |
          set -o pipefail
          set +e
          npm test 2>&1 | tee out/node-test.log
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > out/status.txt
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-node-${{ matrix.label }}
          path: out/
          if-no-files-found: error

  search-scheduler:
    name: Source-derived live-search comparison
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 90b5f0abc10384dd77b4e6bb378881cf7f7c50f6
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 751d0eda4c6da9742850283c540dc59e0b6377ea
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify both exact revisions and compare extracted search workers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          git rev-parse HEAD | tee out/candidate-revision.txt
          git -C baseline rev-parse HEAD | tee out/baseline-revision.txt
          test "$(git rev-parse HEAD)" = 90b5f0abc10384dd77b4e6bb378881cf7f7c50f6
          test "$(git -C baseline rev-parse HEAD)" = 751d0eda4c6da9742850283c540dc59e0b6377ea
          XCODE="$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          swiftc --version | tee out/swift-version.txt
          SOURCE=native/ios-app/Poki/Chat/PokiDetailsView.swift
          HARNESS=test/fixtures/live-search-refresh/check.mjs
          node "$HARNESS" "$SOURCE" coalesced | tee out/coalesced.log
          node "$HARNESS" "baseline/$SOURCE" restart | tee out/restart.log
          grep -Eq '^PUBLICATIONS_DURING_UPDATES=[1-9][0-9]*$' out/coalesced.log
          grep -Fxq 'PUBLICATIONS_DURING_UPDATES=0' out/restart.log
          for mode in coalesced restart; do
            test "$(grep -c '^PASS:' "out/$mode.log")" = 4
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-search-scheduler-comparison
          path: out/
          if-no-files-found: error
