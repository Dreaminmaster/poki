# Pre-alpha: every merge into main is built and published to the Pre-alpha channel, with no tag to
# push and no step to wait for. One macOS job does it all (version, build, tag, publish), because
# each extra job costs a runner pickup. It runs on main so that the caches it saves are the ones
# every later run can read; a run from a tag could only read main's caches, and main had none, so
# every release build used to start cold (about 20 minutes, 9 of them in PiSwiftAI).
#
# The build number is the commit count of main, so it only goes up while main is never rewritten.
# Tag: app-<VERSION>-prealpha.<count>; release: the rolling app-prealpha-latest, mirrored to the old
# ios-prealpha-latest for Poki Setup 0.2.2 and earlier (docs/release-channels.md).
name: Pre-alpha
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Hotfix Pre-alpha {0} ({1})', inputs.version, inputs.build) || '' }}

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', '.github/ISSUE_TEMPLATE/**', '.github/channels.json', '.github/workflows/promote-*.yml']
  # Dispatch from main so the workflow and publisher come from the trusted branch.
  workflow_dispatch:
    inputs:
      ref:
        description: "Hotfix branch to build (hotfix/...)"
        type: string
        required: true
      version:
        description: "App version (X.Y.Z)"
        type: string
        required: true
      build:
        description: "App build number"
        type: string
        required: true

# Main has one rolling publisher. Hotfixes publish versioned releases in a separate queue.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'prealpha-hotfix' || 'prealpha' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prealpha:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # The Xcode 27 image: the iOS 27.1 SDK or later, which the iPhone Duo needs (build-ipa).
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        # Every commit (for the count) but no file contents beyond this one.
        with: { fetch-depth: 0, filter: 'tree:0' }

      - id: v
        name: Version and build number
        run: |
          set -euo pipefail
          VERSION="$(tr -d ' \n' < native/ios-app/VERSION)"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::native/ios-app/VERSION is not X.Y.Z"; exit 1; }
          BUILD="$(git rev-list --count HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Poki $VERSION ($BUILD) from $(git log -1 --format='%h %s')"

      - id: build
        uses: ./.github/actions/build-ipa
        with:
          version: ${{ steps.v.outputs.version }}
          build: ${{ steps.v.outputs.build }}
          editions: external

      # Kept 90 days: an alpha or beta promoted later copies this exact file (promote-alpha.yml).
      - uses: actions/upload-artifact@v4
        with:
          name: Poki-unsigned
          path: out/
          if-no-files-found: error
          retention-days: 90

      - name: Publish to app-prealpha-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/publish-rolling.sh prealpha "${{ steps.v.outputs.version }}" "${{ steps.v.outputs.build }}" out

      # After publishing, so saving never delays the release, but also when publishing fails, so a
      # re-run starts warm. Same paths as the build-ipa action.
      - if: always() && steps.build.outcome == 'success' && steps.build.outputs.rust-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            native/launcher/target
          key: ${{ steps.build.outputs.rust-key }}
      - if: always() && steps.build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            build/app-external
            build/app-local
            ~/Library/Developer/Xcode/DerivedData/ModuleCache.noindex
          key: ipa-xcode27-${{ github.sha }}

      - name: Summary
        if: always()
        run: |
          echo "## Poki v${{ steps.v.outputs.version }} (${{ steps.v.outputs.build }}) Pre-alpha" >> "$GITHUB_STEP_SUMMARY"
          echo "Rust library from cache: ${{ steps.build.outputs.rust-hit || 'false' }}" >> "$GITHUB_STEP_SUMMARY"

  resolve-hotfix:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
      build: ${{ steps.source.outputs.build }}
    steps:
      - id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.ref }}
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
        run: |
          set -euo pipefail
          if [[ "$SOURCE_REF" != hotfix/?* ]] || ! git check-ref-format "refs/heads/$SOURCE_REF"; then
            echo "::error::ref must be a hotfix/ branch"; exit 1
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must be X.Y.Z"; exit 1; }
          [[ "$BUILD" =~ ^[1-9][0-9]*$ ]] || { echo "::error::build must be a positive integer"; exit 1; }
          encoded_ref="$(jq -nr --arg ref "$SOURCE_REF" '$ref | split("/") | map(@uri) | join("/")')"
          sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$encoded_ref" |
            jq -er --arg ref "refs/heads/$SOURCE_REF" 'select(.ref == $ref and .object.type == "commit") | .object.sha')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::hotfix branch did not resolve to a commit"; exit 1; }
          { echo "sha=$sha"; echo "version=$VERSION"; echo "build=$BUILD"; } >> "$GITHUB_OUTPUT"
          printf '## Poki v%s (%s) Pre-alpha from %s at `%s`\n' "$VERSION" "$BUILD" "$SOURCE_REF" "$sha" >> "$GITHUB_STEP_SUMMARY"

  build-hotfix:
    needs: resolve-hotfix
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-hotfix.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/build-ipa
        with:
          version: ${{ needs.resolve-hotfix.outputs.version }}
          build: ${{ needs.resolve-hotfix.outputs.build }}
          editions: external
      - uses: actions/upload-artifact@v4
        with:
          name: Poki-unsigned
          path: out/
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  publish-hotfix:
    needs: [resolve-hotfix, build-hotfix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          ref: ${{ needs.resolve-hotfix.outputs.sha }}
          fetch-depth: 0
          filter: 'tree:0'
      - uses: actions/checkout@v4
        with:
          path: pipeline
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Poki-unsigned
          path: app
      - name: Verify and record the hotfix IPA
        working-directory: app
        env:
          SOURCE_SHA: ${{ needs.resolve-hotfix.outputs.sha }}
          VERSION: ${{ needs.resolve-hotfix.outputs.version }}
          BUILD: ${{ needs.resolve-hotfix.outputs.build }}
        run: |
          set -euo pipefail
          (cd ../source && test "$(git rev-parse HEAD)" = "$SOURCE_SHA")
          sha256sum -c SHA256SUMS
          python3 ../pipeline/.github/scripts/verify-ipa-version.py Poki-external-unsigned.ipa "$VERSION" "$BUILD"
          ipa_sha="$(sha256sum Poki-external-unsigned.ipa | cut -d ' ' -f 1)"
          jq -n --arg sha "$SOURCE_SHA" --arg version "$VERSION" --arg build "$BUILD" --arg ipa "$ipa_sha" \
            '{sha: $sha, version: $version, build: $build, ipa_sha256: $ipa}' > "$RUNNER_TEMP/poki-hotfix-source.json"
      - uses: actions/upload-artifact@v4
        with:
          name: Poki-hotfix-source
          path: ${{ runner.temp }}/poki-hotfix-source.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - name: Publish the versioned hotfix Pre-alpha
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve-hotfix.outputs.version }}
          BUILD: ${{ needs.resolve-hotfix.outputs.build }}
        run: ../pipeline/.github/scripts/publish-rolling.sh prealpha "$VERSION" "$BUILD" ../app --versioned
